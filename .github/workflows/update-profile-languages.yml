name: Atualizar card de linguagens

on:
  push:
    paths:
      - ".github/workflows/update-profile-languages.yml"

  schedule:
    - cron: "0 9 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-card:
    name: Gerar estatísticas de linguagens
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Gerar card de linguagens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from PIL import Image, ImageDraw, ImageFont

          USERNAME = "GabrielRochadeLima"
          OUTPUT_FILE = "assets/most-used-languages.png"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "GitHub-Profile-Language-Stats"
          }

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          print("================================")
          print("BUSCANDO REPOSITÓRIOS")
          print("================================")

          repos = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?type=owner"
                  f"&visibility=public"
                  f"&per_page=100"
                  f"&page={page}"
              )

              page_repos = get_json(url)

              if not page_repos:
                  break

              repos.extend(page_repos)

              if len(page_repos) < 100:
                  break

              page += 1

          print(f"Repositórios encontrados: {len(repos)}")

          print("")
          print("================================")
          print("ANALISANDO LINGUAGENS")
          print("================================")

          totals = {}

          for repo in repos:
              repo_name = repo["name"]

              if repo.get("fork", False):
                  print(f"Ignorando fork: {repo_name}")
                  continue

              if repo.get("archived", False):
                  print(f"Ignorando arquivado: {repo_name}")
                  continue

              print(f"Analisando: {repo_name}")

              languages = get_json(repo["languages_url"])

              for language, amount in languages.items():
                  totals[language] = totals.get(language, 0) + amount

          if not totals:
              print("Nenhuma linguagem encontrada.")
              raise SystemExit(0)

          grand_total = sum(totals.values())

          ranked = sorted(
              totals.items(),
              key=lambda item: item[1],
              reverse=True
          )

          top_languages = ranked[:5]

          print("")
          print("================================")
          print("TOP 5 LINGUAGENS")
          print("================================")

          for position, (language, amount) in enumerate(
              top_languages,
              start=1
          ):
              percentage = (amount / grand_total) * 100

              print(
                  f"{position}. {language}: "
                  f"{amount} bytes "
                  f"({percentage:.2f}%)"
              )

          colors = {
              "JavaScript": "#F7DF1E",
              "TypeScript": "#3178C6",
              "Python": "#3776AB",
              "HTML": "#E34C26",
              "CSS": "#563D7C",
              "Java": "#ED8B00",
              "C": "#A8B9CC",
              "C++": "#00599C",
              "C#": "#239120",
              "PHP": "#777BB4",
              "Ruby": "#CC342D",
              "Go": "#00ADD8",
              "Rust": "#DEA584",
              "Kotlin": "#A97BFF",
              "Swift": "#F05138",
              "Dart": "#00B4AB",
              "SQL": "#336791",
              "Jupyter Notebook": "#F37626",
              "Shell": "#89E051",
              "PowerShell": "#012456",
              "Vue": "#41B883",
              "SCSS": "#C6538C",
              "Less": "#1D365D",
              "R": "#198CE7",
              "Dockerfile": "#384D54"
          }

          WIDTH = 560
          HEIGHT = 330

          BACKGROUND = "#0D1117"
          BORDER = "#30363D"
          TEXT = "#F0F6FC"
          SECONDARY = "#8B949E"
          TRACK = "#21262D"

          image = Image.new(
              "RGB",
              (WIDTH, HEIGHT),
              BACKGROUND
          )

          draw = ImageDraw.Draw(image)

          FONT_TITLE = (
              "/usr/share/fonts/truetype/"
              "dejavu/DejaVuSans-Bold.ttf"
          )

          FONT_NORMAL = (
              "/usr/share/fonts/truetype/"
              "dejavu/DejaVuSans.ttf"
          )

          title_font = ImageFont.truetype(
              FONT_TITLE,
              23
          )

          language_font = ImageFont.truetype(
              FONT_NORMAL,
              15
          )

          percent_font = ImageFont.truetype(
              FONT_NORMAL,
              14
          )

          draw.rounded_rectangle(
              (
                  1,
                  1,
                  WIDTH - 2,
                  HEIGHT - 2
              ),
              radius=15,
              fill=BACKGROUND,
              outline=BORDER,
              width=2
          )

          draw.text(
              (30, 25),
              "Linguagens mais utilizadas",
              fill=TEXT,
              font=title_font
          )

          START_Y = 78
          BAR_X = 30
          BAR_WIDTH = 420
          BAR_HEIGHT = 10
          PERCENT_X = 465

          for index, (language, amount) in enumerate(
              top_languages
          ):
              y = START_Y + index * 47

              percentage = (amount / grand_total) * 100

              draw.text(
                  (BAR_X, y),
                  language,
                  fill=TEXT,
                  font=language_font
              )

              bar_y = y + 25

              draw.rounded_rectangle(
                  (
                      BAR_X,
                      bar_y,
                      BAR_X + BAR_WIDTH,
                      bar_y + BAR_HEIGHT
                  ),
                  radius=5,
                  fill=TRACK
              )

              filled_width = max(
                  5,
                  int(
                      BAR_WIDTH
                      * percentage
                      / 100
                  )
              )

              language_color = colors.get(
                  language,
                  "#58A6FF"
              )

              draw.rounded_rectangle(
                  (
                      BAR_X,
                      bar_y,
                      BAR_X + filled_width,
                      bar_y + BAR_HEIGHT
                  ),
                  radius=5,
                  fill=language_color
              )

              draw.text(
                  (
                      PERCENT_X,
                      y + 17
                  ),
                  f"{percentage:.2f}%",
                  fill=SECONDARY,
                  font=percent_font
              )

          os.makedirs(
              "assets",
              exist_ok=True
          )

          image.save(
              OUTPUT_FILE,
              "PNG",
              optimize=True
          )

          print("")
          print("================================")
          print("CARD GERADO COM SUCESSO")
          print("================================")
          print(f"Arquivo: {OUTPUT_FILE}")

          PY

      - name: Salvar card atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/most-used-languages.png

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no card."
            exit 0
          fi

          git commit -m "chore: atualizar card de linguagens"
          git push
